<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="108" height="108" rx="24" fill="#000000" />
  
  <!-- Subtle ambient glow -->
  <path d="M28,36 L46,76 L54,32 L54,76 M54,32 C68,32 78,36 78,44 C78,52 68,52 54,52 C70,52 82,56 82,64 C82,74 68,76 54,76"
        stroke="#3B82F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3" filter="url(#glow)" />

  <!-- Letter V & B spine in Electric Blue -->
  <path d="M28,36 L46,76 L54,32 L54,76"
        stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Letter B dual harmonic loops -->
  <path d="M54,32 C68,32 78,36 78,44 C78,52 68,52 54,52 C70,52 82,56 82,64 C82,74 68,76 54,76"
        stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Acoustic waveform soundwave pulse through V notch -->
  <line x1="33" y1="46" x2="33" y2="58" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
  <line x1="39" y1="38" x2="39" y2="66" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
  <line x1="45" y1="48" x2="45" y2="72" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
</svg>
